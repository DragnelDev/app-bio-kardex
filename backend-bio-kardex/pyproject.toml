[project]
name = "biokardex-backend"
version = "0.1.0"
description = "BioKardex - API del sistema integral de farmacia"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "psycopg[binary]>=3.2",
    "django-cors-headers>=4.4",
    "django-environ>=0.11",
    "pillow>=10.4",
    "drf-spectacular>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "tests/test_*.py"]
