# Solo PostgreSQL por ahora (desarrollo local). Backend y frontend se agregan despues.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: biokardex
      POSTGRES_USER: biokardex
      POSTGRES_PASSWORD: biokardex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
